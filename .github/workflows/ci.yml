name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oja
          POSTGRES_PASSWORD: oja
          POSTGRES_DB: oja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oja -d oja_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://oja:oja@localhost:5432/oja_test
      SUPABASE_DB_URL: postgresql://oja:oja@localhost:5432/oja_canonical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npx tsx scripts/canonical.ts migrate
      - run: npx tsx scripts/canonical.ts verify
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
